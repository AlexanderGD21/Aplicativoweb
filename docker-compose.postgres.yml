services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diccionario_kichwa}
      POSTGRES_USER: ${POSTGRES_USER:-diccionario_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD fuera del repositorio}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_diccionario_data:/var/lib/postgresql/data

volumes:
  postgres_diccionario_data:
